# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 24/100 · legal operations · renewal-window
# Actor: renewal manager for legal operations
# Trigger: renewal-window request enters the legal operations queue
# Authority: tools only: nika:json_merge_patch, nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: merged policy is approved and keeps the original identifier for uc-024-legal-renewal-window
# Business outcome: apply an approved override without losing the base record for legal operations

nika: uc-024-legal-renewal-window

model: mock/echo

const:
  base: {"id":"uc-024-legal-renewal-window","owner":"renewal manager for legal operations","state":"draft","value":24}
  patch: {"state":"approved","value":34}
permits:
  tools: ["nika:json_merge_patch", "nika:jq"]
tasks:
  merge:
    invoke:
      tool: "nika:json_merge_patch"
      args:
        target: ${{ const.base }}
        patch: ${{ const.patch }}
  project:
    with:
      merged: ${{ tasks.merge.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ with.merged }}
        expression: '{id, owner, state, value, ready: (.state == "approved")}'
outputs:
  merged: ${{ tasks.project.output }}
