# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 99/100 · creator business · publish-window
# Actor: publishing lead for creator business
# Trigger: publish-window request enters the creator business queue
# Authority: tools only: nika:jq, nika:log; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: threshold result is true and the admitted branch emits one log for uc-099-creator-publish-window
# Business outcome: open an action only when a deterministic threshold is met for creator business

nika: uc-099-creator-publish-window

model: mock/echo

const:
  case: "uc-099-creator-publish-window"
  observation: {"metric":119,"threshold":99}
permits:
  tools: ["nika:jq", "nika:log"]
tasks:
  decide:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.observation }}
        expression: '.metric >= .threshold'
  admitted:
    with:
      decision: ${{ tasks.decide.output }}
    when: ${{ with.decision == true }}
    invoke:
      tool: "nika:log"
      args:
        level: info
        message: "threshold admitted uc-099-creator-publish-window"
outputs:
  case: ${{ const.case }}
  admitted: ${{ tasks.decide.output }}
