name: Release

# SECURITY: no github.event text is interpolated directly into shell source.
# npm trusted publishing must authorize this exact workflow for all five packages.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Checked-in SDK + engine release train version (e.g. 0.115.0)'
        required: true
      dry_run:
        description: 'Build and inspect without staging on npm'
        type: boolean
        default: false

concurrency:
  group: nika-client-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      prepared_sha: ${{ steps.release-metadata.outputs.prepared_sha }}
    env:
      VERSION: ${{ github.event.inputs.version }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin trusted-publishing npm CLI
        run: |
          npm install --global npm@11.19.1
          npm stage --help

      - name: Validate checked-in release train
        env:
          GH_TOKEN: ${{ secrets.NIKA_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION (expected 0.x.y)"
            exit 1
          fi
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            echo "::error::package.json must already be version $VERSION"
            exit 1
          fi
          npm run sync:native-versions
          git diff --exit-code -- package.json package-lock.json packages/native

          assets=(
            "nika-macos-arm64-$VERSION.tar.gz"
            "nika-macos-x64-$VERSION.tar.gz"
            "nika-linux-arm64-$VERSION.tar.gz"
            "nika-linux-x64-$VERSION.tar.gz"
          )
          release_json=$(gh release view "v$VERSION" --repo supernovae-st/nika --json assets,isDraft,tagName)
          if [ "$(jq -r .isDraft <<<"$release_json")" != false ]; then
            echo "::error::nika v$VERSION is still a draft"
            exit 1
          fi
          for asset in "${assets[@]}" SHA256SUMS; do
            if ! jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' <<<"$release_json" >/dev/null; then
              echo "::error::nika v$VERSION is missing release asset $asset"
              exit 1
            fi
          done

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: supernovae-st/nika
          path: nika-source
          ref: "v${{ env.VERSION }}"
          token: ${{ secrets.NIKA_REPO_TOKEN || github.token }}

      - name: Enforce SDK coverage against tagged engine source
        run: npm run check:coverage

      - name: Download and verify engine release assets
        env:
          GH_TOKEN: ${{ secrets.NIKA_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p engine-assets
          gh release download "v$VERSION" \
            --repo supernovae-st/nika \
            --dir engine-assets \
            --pattern "nika-macos-arm64-$VERSION.tar.gz" \
            --pattern "nika-macos-x64-$VERSION.tar.gz" \
            --pattern "nika-linux-arm64-$VERSION.tar.gz" \
            --pattern "nika-linux-x64-$VERSION.tar.gz" \
            --pattern SHA256SUMS
          cd engine-assets
          for asset in nika-*"$VERSION".tar.gz; do
            grep -E "[[:space:]]${asset}$" SHA256SUMS | sha256sum --check --strict
          done

      - name: Prove the pinned contract and generated types against the released binary
        run: |
          set -euo pipefail
          probe_root=$(mktemp -d "${RUNNER_TEMP:-/tmp}/nika-client-release-openapi.XXXXXX")
          project_dir="$probe_root/project"
          workflows_dir="$probe_root/workflows"
          state_dir="$probe_root/state"
          token_file="$probe_root/token"
          server_pid=""
          server_url=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            find "$probe_root" -depth -delete
          }
          assert_server_live() {
            phase=$1
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$probe_root/server.log" >&2
              echo "::error::launched released nika serve exited $phase"
              exit 1
            fi
          }
          trap cleanup EXIT
          mkdir -p "$project_dir" "$workflows_dir" "$state_dir"
          printf '%s\n' 'nika: release-openapi-probe' > "$project_dir/nika.yaml"
          tar -xzf "engine-assets/nika-linux-x64-$VERSION.tar.gz" -C "$probe_root" nika
          token="nika-release-openapi-probe-token-0116"
          printf '%s\n' "$token" > "$token_file"
          chmod 600 "$token_file"
          (
            cd "$project_dir"
            exec "$probe_root/nika" serve \
              --bind 127.0.0.1:0 \
              --workflows "$workflows_dir" \
              --token-file "$token_file" \
              --state-root "$state_dir" \
              --plain
          ) >"$probe_root/server.log" 2>&1 &
          server_pid=$!
          # Port zero makes the kernel choose an unoccupied socket. The URL is
          # then learned only from this PID's listener receipt, while liveness
          # checks before and after every request bind the response to that PID.
          for _ in {1..50}; do
            assert_server_live "before listener discovery"
            while IFS= read -r line; do
              if [[ "$line" =~ ^nika\ serve.*listening\ (http://127\.0\.0\.1:[0-9]+) ]]; then
                server_url="${BASH_REMATCH[1]}"
                break
              fi
            done < "$probe_root/server.log"
            if [ -n "$server_url" ]; then
              break
            fi
            sleep 0.1
          done
          if ! [[ "$server_url" =~ ^http://127\.0\.0\.1:[0-9]+$ ]]; then
            cat "$probe_root/server.log" >&2
            echo "::error::launched released nika serve did not emit its loopback listener receipt"
            exit 1
          fi
          ok=0
          for _ in {1..50}; do
            assert_server_live "before GET /health"
            if curl -fsS "$server_url/health" >/dev/null; then
              assert_server_live "after GET /health"
              ok=1
              break
            fi
            sleep 0.1
          done
          if [ "$ok" != 1 ]; then
            cat "$probe_root/server.log" >&2
            echo "::error::released nika serve never answered GET /health"
            exit 1
          fi
          assert_server_live "before GET /v1/openapi.json"
          curl -fsS \
            -H "Authorization: Bearer $token" \
            "$server_url/v1/openapi.json" \
            > "$probe_root/live.json"
          assert_server_live "after GET /v1/openapi.json"
          jq -S . openapi.json > "$probe_root/pinned.sorted.json"
          jq -S . "$probe_root/live.json" > "$probe_root/live.sorted.json"
          if ! cmp -s "$probe_root/pinned.sorted.json" "$probe_root/live.sorted.json"; then
            echo "::error::openapi.json differs from the released v$VERSION binary"
            exit 1
          fi
          assert_server_live "before generated-type fetch"
          NIKA_TOKEN="$token" npm run generate:types -- "$server_url"
          assert_server_live "after generated-type fetch"
          rm -f .openapi-cache.json
          git diff --exit-code -- openapi.json src/generated/openapi.d.ts

      - name: Build native payload packages
        run: |
          set -euo pipefail
          source_commit=$(git -C nika-source rev-parse HEAD)
          packages=(
            "packages/native/darwin-arm64:nika-macos-arm64-$VERSION.tar.gz"
            "packages/native/darwin-x64:nika-macos-x64-$VERSION.tar.gz"
            "packages/native/linux-arm64-gnu:nika-linux-arm64-$VERSION.tar.gz"
            "packages/native/linux-x64-gnu:nika-linux-x64-$VERSION.tar.gz"
          )
          for pair in "${packages[@]}"; do
            package_dir=${pair%%:*}
            asset=${pair#*:}
            extract_dir=$(mktemp -d)
            tar -xzf "engine-assets/$asset" -C "$extract_dir" nika
            archive_sha=$(awk -v asset="$asset" '$2 == asset { print $1 }' engine-assets/SHA256SUMS)
            if [ -z "$archive_sha" ]; then
              echo "::error::No checksum found for $asset"
              exit 1
            fi
            node scripts/build-native-package.mjs \
              --package "$package_dir" \
              --binary "$extract_dir/nika" \
              --license nika-source/LICENSE \
              --asset "$asset" \
              --asset-sha256 "$archive_sha" \
              --source-commit "$source_commit"
          done

      - name: Seal release metadata in every package
        id: release-metadata
        run: |
          prepared_sha="$(git rev-parse HEAD)"
          if [ "$prepared_sha" != "$GITHUB_SHA" ]; then
            echo "::error::checked-out preparation commit differs from dispatched main commit"
            exit 1
          fi
          node scripts/stamp-release-commit.mjs "$prepared_sha"
          jq -n \
            --arg version "$VERSION" \
            --arg prepared_sha "$prepared_sha" \
            '{schema_version: 1, version: $version, prepared_sha: $prepared_sha}' \
            > release-metadata.json
          echo "prepared_sha=$prepared_sha" >> "$GITHUB_OUTPUT"

      - name: Pack and inspect all packages
        env:
          PREPARED_SHA: ${{ steps.release-metadata.outputs.prepared_sha }}
        run: |
          set -euo pipefail
          mkdir -p release-tarballs pack-reports
          for package_dir in packages/native/*; do
            report="pack-reports/$(basename "$package_dir").json"
            npm pack "$package_dir" --json --pack-destination release-tarballs > "$report"
            node scripts/verify-native-pack.mjs \
              "$report" release-tarballs "$PREPARED_SHA" "$VERSION"
          done
          npm pack --ignore-scripts --json --pack-destination release-tarballs \
            > pack-reports/nika-client.json
          node scripts/verify-client-pack.mjs \
            pack-reports/nika-client.json release-tarballs "$PREPARED_SHA" "$VERSION"

      - name: Refuse an already-started public train
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          packages=(
            @supernovae-st/nika-darwin-arm64
            @supernovae-st/nika-darwin-x64
            @supernovae-st/nika-linux-arm64
            @supernovae-st/nika-linux-x64
            @supernovae-st/nika-client
          )
          for package_name in "${packages[@]}"; do
            if npm view "$package_name@$VERSION" version >/dev/null 2>&1; then
              echo "::error::$package_name@$VERSION already exists publicly"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nika-client-release-${{ env.VERSION }}
          path: |
            release-tarballs/*.tgz
            pack-reports/*.json
            release-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "### Nika client release candidate"
            echo "- Version: $VERSION"
            echo "- Result: built, tested, checksummed, packed, and inspected"
            echo "- npm staging: skipped by dry run"
          } >> "$GITHUB_STEP_SUMMARY"

  stage:
    if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-staging
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nika-client-release-${{ env.VERSION }}
          path: release-candidate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin trusted-publishing npm CLI
        run: |
          npm install --global npm@11.19.1
          npm stage --help

      - name: Stage payloads, then SDK through OIDC
        run: |
          set -euo pipefail
          prepared_sha="$(jq -r .prepared_sha release-candidate/release-metadata.json)"
          if [ "$(git rev-parse HEAD)" != "$prepared_sha" ]; then
            echo "::error::artifact commit and checked-out publishing commit differ"
            exit 1
          fi
          payloads=(
            "release-candidate/release-tarballs/supernovae-st-nika-darwin-arm64-$VERSION.tgz"
            "release-candidate/release-tarballs/supernovae-st-nika-darwin-x64-$VERSION.tgz"
            "release-candidate/release-tarballs/supernovae-st-nika-linux-arm64-$VERSION.tgz"
            "release-candidate/release-tarballs/supernovae-st-nika-linux-x64-$VERSION.tgz"
          )
          for tarball in "${payloads[@]}"; do
            npm stage publish "$tarball" --access public
          done
          npm stage publish \
            "release-candidate/release-tarballs/supernovae-st-nika-client-$VERSION.tgz" \
            --access public

      - name: Approval summary
        run: |
          {
            echo "### Nika client release staged"
            echo "- Version: $VERSION"
            echo "- Order: four native payloads, then root SDK"
            echo "- Authentication: npm trusted publishing (OIDC), no write token"
            echo "- Prepared commit: $(jq -r .prepared_sha release-candidate/release-metadata.json)"
            echo "- Next gate: inspect and approve all five staged packages with human 2FA"
          } >> "$GITHUB_STEP_SUMMARY"
