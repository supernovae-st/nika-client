# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 16/100 · people operations · candidate-intake
# Actor: recruiter for people operations
# Trigger: candidate-intake request enters the people operations queue
# Authority: tools only: nika:date; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: measured duration is positive and uses fixed ISO timestamps for uc-016-people-candidate-intake
# Business outcome: calculate an operational service window without ambient time for people operations

nika: uc-016-people-candidate-intake

model: mock/echo

const:
  case: "uc-016-people-candidate-intake"
  start: "2026-08-17T09:00:00Z"
  end: "2026-08-18T17:00:00Z"
permits:
  tools: ["nika:date"]
tasks:
  duration:
    invoke:
      tool: "nika:date"
      args:
        op: diff
        start: ${{ const.start }}
        end: ${{ const.end }}
        unit: hours
outputs:
  case: ${{ const.case }}
  hours: ${{ tasks.duration.output }}
