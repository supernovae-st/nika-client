# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 31/100 · education operations · enrollment-guard
# Actor: registrar for education operations
# Trigger: enrollment-guard request enters the education operations queue
# Authority: tools only: nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: projection carries the domain, actor, and accepted state for uc-031-education-enrollment-guard
# Business outcome: produce a normalized decision card for education operations

nika: uc-031-education-enrollment-guard

model: mock/echo

const:
  record: {"case":"enrollment-guard","domain":"education","actor":"registrar for education operations","metric":51,"threshold":31,"state":"accepted"}
permits:
  tools: ["nika:jq"]
tasks:
  project:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.record }}
        expression: '{case, domain, actor, state}'
outputs:
  card: ${{ tasks.project.output }}
