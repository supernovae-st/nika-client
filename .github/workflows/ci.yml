name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Tests + Build ──────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - run: npm ci
      - run: npm test
      - run: npm run build

  # ── SDK Coverage Check ────────────────────────────────
  # Verifies that the SDK covers all nika-serve routes,
  # SSE event types, and response types.
  sdk-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Checkout nika repo for server source analysis
      # clock: released · the SDK serves RELEASED users, so coverage judges
      # against the latest release tag, never a floating engine main (the
      # clock-sweep caught the HEAD checkout 2026-07-20 · a sister engine
      # merge could flip this gate at constant SDK content).
      - id: engine-tag
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -o /dev/null -w '%{url_effective}'             https://github.com/supernovae-st/nika/releases/latest | sed 's|.*/tag/||')
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag: $tag" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: supernovae-st/nika
          ref: ${{ steps.engine-tag.outputs.tag }}
          path: nika
          # NIKA_REPO_TOKEN is withheld on dependabot/fork PR runs, so the
          # expression resolves empty and checkout errors "Input required and
          # not supplied: token". Fall back to the always-present github.token
          # (sufficient to clone the public nika repo). Advisory gate stays advisory.
          token: ${{ secrets.NIKA_REPO_TOKEN || github.token }}

      - run: npm ci
      # `nika serve` is target-facing — it re-admits to the engine during the
      # v0.9x arc (see CHANGELOG). Until the serve source lands, the coverage
      # check has nothing to analyze and errors "nika-serve not found"; that is
      # not a regression, so the gate is advisory here (it hard-fails legit SDK
      # PRs otherwise). Flip back to a hard gate when serve ships.
      - name: Check SDK coverage against nika-serve
        run: |
          if npm run check:coverage -- ./nika; then
            echo "SDK coverage: OK"
          else
            echo "::warning::SDK coverage advisory — nika serve is not yet shipped (target-facing SDK, see CHANGELOG). Re-enable the hard gate when the serve surface lands."
          fi

  # ── Type Drift Check ──────────────────────────────────
  # Starts a live nika serve, generates types from OpenAPI,
  # and fails if generated types differ from committed ones.
  type-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Resolve the latest tag → the versioned asset. The old URL pinned
      # `nika-x86_64-unknown-linux-gnu.tar.gz` under /latest/download/, which
      # 404s — releases publish `nika-linux-x64-<version>.tar.gz`.
      - name: Install nika
        run: |
          tag=$(curl -sf https://api.github.com/repos/supernovae-st/nika/releases/latest | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).tag_name")
          ver=${tag#v}
          curl -fsSL "https://github.com/supernovae-st/nika/releases/download/${tag}/nika-linux-x64-${ver}.tar.gz" | tar xz
          chmod +x nika && sudo mv nika /usr/local/bin/

      - run: npm ci
      # The type-drift check needs a live `nika serve`. That surface is
      # target-facing (see CHANGELOG) — until it ships, `nika serve --help`
      # fails and the gate is advisory. It re-activates automatically the day
      # serve lands (no maintainer flip needed).
      - name: Type drift (against live nika serve)
        env:
          NIKA_SERVE_TOKEN: ci-test-token-32-chars-minimum!!
          NIKA_URL: http://127.0.0.1:3000
          NIKA_TOKEN: ci-test-token-32-chars-minimum!!
        run: |
          if ! nika serve --help >/dev/null 2>&1; then
            echo "::warning::type-drift advisory — nika serve is not yet shipped (target-facing SDK). Re-activates automatically when serve lands."
            exit 0
          fi
          # The fixture speaks the shipped envelope — this exact file passes
          # `nika check` clean (rc=0) on the released v0.107.0.
          mkdir -p /tmp/wf
          cat > /tmp/wf/test.nika.yaml <<'EOF'
          nika: v1
          workflow:
            id: test
          tasks:
            hello:
              infer:
                model: mock/fast
                prompt: "say hello"
                max_tokens: 64
          EOF
          nika serve --bind 127.0.0.1:3000 --workflows /tmp/wf &
          sleep 2
          npm run generate:types
          if git diff --exit-code src/generated/; then
            echo "Types in sync"
          else
            echo "::error::Generated types differ from committed types. Run: npm run generate:types"
            exit 1
          fi

  # ── Version Sync Check ────────────────────────────────
  # Warns if nika-client version doesn't match latest nika release.
  version-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version alignment with nika
        run: |
          SDK_VERSION=$(node -p "require('./package.json').version")
          NIKA_VERSION=$(curl -sf https://api.github.com/repos/supernovae-st/nika/releases/latest | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).tag_name.replace('v','')" 2>/dev/null || echo "unknown")

          echo "SDK version:  $SDK_VERSION"
          echo "Nika version: $NIKA_VERSION"

          if [ "$NIKA_VERSION" = "unknown" ]; then
            echo "::warning::Could not fetch latest nika version"
          elif [ "$SDK_VERSION" != "$NIKA_VERSION" ]; then
            echo "::warning::Version mismatch — SDK $SDK_VERSION vs nika $NIKA_VERSION. Consider syncing."
          else
            echo "Versions in sync"
          fi
