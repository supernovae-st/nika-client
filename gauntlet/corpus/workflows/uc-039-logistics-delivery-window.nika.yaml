# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 39/100 · logistics · delivery-window
# Actor: delivery coordinator for logistics
# Trigger: delivery-window request enters the logistics queue
# Authority: tools only: nika:jq, nika:log; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: threshold result is true and the admitted branch emits one log for uc-039-logistics-delivery-window
# Business outcome: open an action only when a deterministic threshold is met for logistics

nika: uc-039-logistics-delivery-window

model: mock/echo

const:
  case: "uc-039-logistics-delivery-window"
  observation: {"metric":59,"threshold":39}
permits:
  tools: ["nika:jq", "nika:log"]
tasks:
  decide:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.observation }}
        expression: '.metric >= .threshold'
  admitted:
    with:
      decision: ${{ tasks.decide.output }}
    when: ${{ with.decision == true }}
    invoke:
      tool: "nika:log"
      args:
        level: info
        message: "threshold admitted uc-039-logistics-delivery-window"
outputs:
  case: ${{ const.case }}
  admitted: ${{ tasks.decide.output }}
