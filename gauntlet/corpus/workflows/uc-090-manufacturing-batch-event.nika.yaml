# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 90/100 · manufacturing · batch-event
# Actor: batch controller for manufacturing
# Trigger: batch-event request enters the manufacturing queue
# Authority: tools only: nika:emit; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: one typed machine event carries the case identity and accepted state for uc-090-manufacturing-batch-event
# Business outcome: publish a typed completion receipt for subscribers for manufacturing

nika: uc-090-manufacturing-batch-event

model: mock/echo

const:
  receipt: {"case":"uc-090-manufacturing-batch-event","domain":"manufacturing","state":"accepted"}
permits:
  tools: ["nika:emit"]
tasks:
  publish:
    invoke:
      tool: "nika:emit"
      args:
        event_type: "gauntlet.manufacturing.batch-event"
        payload: ${{ const.receipt }}
outputs:
  receipt: ${{ const.receipt }}
