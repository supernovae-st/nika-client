# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 54/100 · marketing · launch-window
# Actor: launch manager for marketing
# Trigger: launch-window request enters the marketing queue
# Authority: tools only: nika:json_merge_patch, nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: merged policy is approved and keeps the original identifier for uc-054-marketing-launch-window
# Business outcome: apply an approved override without losing the base record for marketing

nika: uc-054-marketing-launch-window

model: mock/echo

const:
  base: {"id":"uc-054-marketing-launch-window","owner":"launch manager for marketing","state":"draft","value":54}
  patch: {"state":"approved","value":64}
permits:
  tools: ["nika:json_merge_patch", "nika:jq"]
tasks:
  merge:
    invoke:
      tool: "nika:json_merge_patch"
      args:
        target: ${{ const.base }}
        patch: ${{ const.patch }}
  project:
    with:
      merged: ${{ tasks.merge.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ with.merged }}
        expression: '{id, owner, state, value, ready: (.state == "approved")}'
outputs:
  merged: ${{ tasks.project.output }}
