# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 92/100 · research operations · evidence-diff
# Actor: research analyst for research operations
# Trigger: evidence-diff request enters the research operations queue
# Authority: tools only: nika:validate; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: validation report is valid with zero errors for uc-092-research-evidence-diff
# Business outcome: refuse malformed business input before downstream work for research operations

nika: uc-092-research-evidence-diff

model: mock/echo

const:
  record: {"key":"uc-092-research-evidence-diff","amount":192,"status":"ready"}
permits:
  tools: ["nika:validate"]
tasks:
  validate:
    invoke:
      tool: "nika:validate"
      args:
        data: ${{ const.record }}
        schema:
          type: object
          additionalProperties: false
          required: [key, amount, status]
          properties:
            key: { type: string }
            amount: { type: integer, minimum: 1 }
            status: { type: string, enum: [ready] }
outputs:
  report: ${{ tasks.validate.output }}
  record: ${{ const.record }}
