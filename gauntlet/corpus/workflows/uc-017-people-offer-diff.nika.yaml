# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 17/100 · people operations · offer-diff
# Actor: compensation partner for people operations
# Trigger: offer-diff request enters the people operations queue
# Authority: tools only: nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: all three batch items return in input order with checked=true for uc-017-people-offer-diff
# Business outcome: enrich a bounded batch while preserving source order for people operations

nika: uc-017-people-offer-diff

model: mock/echo

const:
  items: [{"sequence":1,"case":"offer-diff"},{"sequence":2,"case":"offer-diff"},{"sequence":3,"case":"offer-diff"}]
permits:
  tools: ["nika:jq"]
tasks:
  enrich:
    for_each:
      items: ${{ const.items }}
      max_parallel: 2
      fail_fast: true
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ item }}
        expression: '. + {checked: true}'
outputs:
  rows: ${{ tasks.enrich.output }}
