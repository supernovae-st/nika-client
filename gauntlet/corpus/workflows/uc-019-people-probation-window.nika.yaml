# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 19/100 · people operations · probation-window
# Actor: people partner for people operations
# Trigger: probation-window request enters the people operations queue
# Authority: tools only: nika:jq, nika:log; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: threshold result is true and the admitted branch emits one log for uc-019-people-probation-window
# Business outcome: open an action only when a deterministic threshold is met for people operations

nika: uc-019-people-probation-window

model: mock/echo

const:
  case: "uc-019-people-probation-window"
  observation: {"metric":39,"threshold":19}
permits:
  tools: ["nika:jq", "nika:log"]
tasks:
  decide:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.observation }}
        expression: '.metric >= .threshold'
  admitted:
    with:
      decision: ${{ tasks.decide.output }}
    when: ${{ with.decision == true }}
    invoke:
      tool: "nika:log"
      args:
        level: info
        message: "threshold admitted uc-019-people-probation-window"
outputs:
  case: ${{ const.case }}
  admitted: ${{ tasks.decide.output }}
