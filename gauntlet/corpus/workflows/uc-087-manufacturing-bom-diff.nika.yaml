# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 87/100 · manufacturing · bom-diff
# Actor: bom engineer for manufacturing
# Trigger: bom-diff request enters the manufacturing queue
# Authority: tools only: nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: all three batch items return in input order with checked=true for uc-087-manufacturing-bom-diff
# Business outcome: enrich a bounded batch while preserving source order for manufacturing

nika: uc-087-manufacturing-bom-diff

model: mock/echo

const:
  items: [{"sequence":1,"case":"bom-diff"},{"sequence":2,"case":"bom-diff"},{"sequence":3,"case":"bom-diff"}]
permits:
  tools: ["nika:jq"]
tasks:
  enrich:
    for_each:
      items: ${{ const.items }}
      max_parallel: 2
      fail_fast: true
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ item }}
        expression: '. + {checked: true}'
outputs:
  rows: ${{ tasks.enrich.output }}
