# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 18/100 · people operations · onboarding-merge
# Actor: people coordinator for people operations
# Trigger: onboarding-merge request enters the people operations queue
# Authority: tools only: nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: parallel branches reconcile into one object with both values for uc-018-people-onboarding-merge
# Business outcome: reconcile two independent operational observations for people operations

nika: uc-018-people-onboarding-merge

model: mock/echo

const:
  left: {"source":"primary","value":18}
  right: {"source":"secondary","value":19}
permits:
  tools: ["nika:jq"]
tasks:
  primary:
    invoke:
      tool: "nika:jq"
      args: { input: "${{ const.left }}", expression: "." }
  secondary:
    invoke:
      tool: "nika:jq"
      args: { input: "${{ const.right }}", expression: "." }
  reconcile:
    with:
      primary: ${{ tasks.primary.output }}
      secondary: ${{ tasks.secondary.output }}
    invoke:
      tool: "nika:jq"
      args:
        input:
          primary: ${{ with.primary }}
          secondary: ${{ with.secondary }}
        expression: '{primary: .primary.value, secondary: .secondary.value, delta: (.secondary.value - .primary.value)}'
outputs:
  reconciliation: ${{ tasks.reconcile.output }}
