# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 13/100 · finance operations · expense-policy-merge
# Actor: expense controller for finance operations
# Trigger: expense-policy-merge request enters the finance operations queue
# Authority: tools only: nika:json_diff; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: revision patch is non-empty and points at the changed value for uc-013-finance-expense-policy-merge
# Business outcome: explain exactly what changed between two business revisions for finance operations

nika: uc-013-finance-expense-policy-merge

model: mock/echo

const:
  before: {"id":"uc-013-finance-expense-policy-merge","value":13,"state":"draft"}
  after: {"id":"uc-013-finance-expense-policy-merge","value":14,"state":"approved"}
permits:
  tools: ["nika:json_diff"]
tasks:
  diff:
    invoke:
      tool: "nika:json_diff"
      args:
        before: ${{ const.before }}
        after: ${{ const.after }}
outputs:
  patch: ${{ tasks.diff.output }}
