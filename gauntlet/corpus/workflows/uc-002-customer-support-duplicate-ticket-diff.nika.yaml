# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 2/100 · customer support · duplicate-ticket-diff
# Actor: queue manager for customer support
# Trigger: duplicate-ticket-diff request enters the customer support queue
# Authority: tools only: nika:validate; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: validation report is valid with zero errors for uc-002-customer-support-duplicate-ticket-diff
# Business outcome: refuse malformed business input before downstream work for customer support

nika: uc-002-customer-support-duplicate-ticket-diff

model: mock/echo

const:
  record: {"key":"uc-002-customer-support-duplicate-ticket-diff","amount":102,"status":"ready"}
permits:
  tools: ["nika:validate"]
tasks:
  validate:
    invoke:
      tool: "nika:validate"
      args:
        data: ${{ const.record }}
        schema:
          type: object
          additionalProperties: false
          required: [key, amount, status]
          properties:
            key: { type: string }
            amount: { type: integer, minimum: 1 }
            status: { type: string, enum: [ready] }
outputs:
  report: ${{ tasks.validate.output }}
  record: ${{ const.record }}
