# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 34/100 · education operations · assignment-window
# Actor: course lead for education operations
# Trigger: assignment-window request enters the education operations queue
# Authority: tools only: nika:json_merge_patch, nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: merged policy is approved and keeps the original identifier for uc-034-education-assignment-window
# Business outcome: apply an approved override without losing the base record for education operations

nika: uc-034-education-assignment-window

model: mock/echo

const:
  base: {"id":"uc-034-education-assignment-window","owner":"course lead for education operations","state":"draft","value":34}
  patch: {"state":"approved","value":44}
permits:
  tools: ["nika:json_merge_patch", "nika:jq"]
tasks:
  merge:
    invoke:
      tool: "nika:json_merge_patch"
      args:
        target: ${{ const.base }}
        patch: ${{ const.patch }}
  project:
    with:
      merged: ${{ tasks.merge.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ with.merged }}
        expression: '{id, owner, state, value, ready: (.state == "approved")}'
outputs:
  merged: ${{ tasks.project.output }}
