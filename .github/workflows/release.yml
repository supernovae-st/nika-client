name: Release
on:
  # Manual releases only for now: the engine's release workflow never
  # emitted the old `repository_dispatch: nika-release` (dead wiring,
  # 2026-07-09 audit) - it returns when the SDK rides the release train.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.64.0)'
        required: true
      dry_run:
        description: 'Dry run (skip npm publish)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Version comes from either dispatch source
      VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Validate version
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::No version specified"
            exit 1
          fi
          # Validate semver format (0.x.y only)
          if ! echo "$VERSION" | grep -qE '^0\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected 0.x.y)"
            exit 1
          fi
          echo "Releasing @supernovae-st/nika-client@$VERSION"

      # Bump version in package.json
      - name: Bump version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Install, test, build
      - run: npm ci
      - run: npm test
      - run: npm run build

      # SDK coverage check against nika source
      - uses: actions/checkout@v4
        with:
          repository: supernovae-st/nika
          path: nika-source
          ref: "v${{ env.VERSION }}"
          token: ${{ secrets.NIKA_REPO_TOKEN }}

      - name: SDK coverage check
        run: npm run check:coverage -- ./nika-source
        continue-on-error: true

      # Commit version bump
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: bump version to $VERSION

          Co-Authored-By: Nika Release Bot <nika@supernovae.studio>"
          git push

      # Publish to npm
      - name: Publish to npm
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # Create GitHub release
      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "Synced with [nika v$VERSION](https://github.com/supernovae-st/nika/releases/tag/v$VERSION).

          Install: \`npm install @supernovae-st/nika-client@$VERSION\`" \
            --latest

      - name: Summary
        run: |
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **npm:** [@supernovae-st/nika-client@$VERSION](https://www.npmjs.com/package/@supernovae-st/nika-client)" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** $DRY_RUN" >> $GITHUB_STEP_SUMMARY
