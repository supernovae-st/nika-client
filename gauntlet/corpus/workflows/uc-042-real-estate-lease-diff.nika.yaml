# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 42/100 · real estate operations · lease-diff
# Actor: lease manager for real estate operations
# Trigger: lease-diff request enters the real estate operations queue
# Authority: tools only: nika:validate; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: validation report is valid with zero errors for uc-042-real-estate-lease-diff
# Business outcome: refuse malformed business input before downstream work for real estate operations

nika: uc-042-real-estate-lease-diff

model: mock/echo

const:
  record: {"key":"uc-042-real-estate-lease-diff","amount":142,"status":"ready"}
permits:
  tools: ["nika:validate"]
tasks:
  validate:
    invoke:
      tool: "nika:validate"
      args:
        data: ${{ const.record }}
        schema:
          type: object
          additionalProperties: false
          required: [key, amount, status]
          properties:
            key: { type: string }
            amount: { type: integer, minimum: 1 }
            status: { type: string, enum: [ready] }
outputs:
  report: ${{ tasks.validate.output }}
  record: ${{ const.record }}
