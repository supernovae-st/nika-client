# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 29/100 · clinic administration · followup-window
# Actor: followup coordinator for clinic administration
# Trigger: followup-window request enters the clinic administration queue
# Authority: tools only: nika:jq, nika:log; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: threshold result is true and the admitted branch emits one log for uc-029-clinic-admin-followup-window
# Business outcome: open an action only when a deterministic threshold is met for clinic administration

nika: uc-029-clinic-admin-followup-window

model: mock/echo

const:
  case: "uc-029-clinic-admin-followup-window"
  observation: {"metric":49,"threshold":29}
permits:
  tools: ["nika:jq", "nika:log"]
tasks:
  decide:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.observation }}
        expression: '.metric >= .threshold'
  admitted:
    with:
      decision: ${{ tasks.decide.output }}
    when: ${{ with.decision == true }}
    invoke:
      tool: "nika:log"
      args:
        level: info
        message: "threshold admitted uc-029-clinic-admin-followup-window"
outputs:
  case: ${{ const.case }}
  admitted: ${{ tasks.decide.output }}
