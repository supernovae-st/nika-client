# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 59/100 · software engineering · incident-window
# Actor: incident commander for software engineering
# Trigger: incident-window request enters the software engineering queue
# Authority: tools only: nika:jq, nika:log; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: threshold result is true and the admitted branch emits one log for uc-059-engineering-incident-window
# Business outcome: open an action only when a deterministic threshold is met for software engineering

nika: uc-059-engineering-incident-window

model: mock/echo

const:
  case: "uc-059-engineering-incident-window"
  observation: {"metric":79,"threshold":59}
permits:
  tools: ["nika:jq", "nika:log"]
tasks:
  decide:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.observation }}
        expression: '.metric >= .threshold'
  admitted:
    with:
      decision: ${{ tasks.decide.output }}
    when: ${{ with.decision == true }}
    invoke:
      tool: "nika:log"
      args:
        level: info
        message: "threshold admitted uc-059-engineering-incident-window"
outputs:
  case: ${{ const.case }}
  admitted: ${{ tasks.decide.output }}
