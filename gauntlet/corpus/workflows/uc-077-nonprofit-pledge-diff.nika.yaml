# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 77/100 · nonprofit operations · pledge-diff
# Actor: fundraising analyst for nonprofit operations
# Trigger: pledge-diff request enters the nonprofit operations queue
# Authority: tools only: nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: all three batch items return in input order with checked=true for uc-077-nonprofit-pledge-diff
# Business outcome: enrich a bounded batch while preserving source order for nonprofit operations

nika: uc-077-nonprofit-pledge-diff

model: mock/echo

const:
  items: [{"sequence":1,"case":"pledge-diff"},{"sequence":2,"case":"pledge-diff"},{"sequence":3,"case":"pledge-diff"}]
permits:
  tools: ["nika:jq"]
tasks:
  enrich:
    for_each:
      items: ${{ const.items }}
      max_parallel: 2
      fail_fast: true
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ item }}
        expression: '. + {checked: true}'
outputs:
  rows: ${{ tasks.enrich.output }}
