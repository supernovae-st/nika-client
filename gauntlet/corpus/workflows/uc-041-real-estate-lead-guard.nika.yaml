# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 41/100 · real estate operations · lead-guard
# Actor: lead coordinator for real estate operations
# Trigger: lead-guard request enters the real estate operations queue
# Authority: tools only: nika:jq; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: projection carries the domain, actor, and accepted state for uc-041-real-estate-lead-guard
# Business outcome: produce a normalized decision card for real estate operations

nika: uc-041-real-estate-lead-guard

model: mock/echo

const:
  record: {"case":"lead-guard","domain":"real-estate","actor":"lead coordinator for real estate operations","metric":61,"threshold":41,"state":"accepted"}
permits:
  tools: ["nika:jq"]
tasks:
  project:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.record }}
        expression: '{case, domain, actor, state}'
outputs:
  card: ${{ tasks.project.output }}
