# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 60/100 · software engineering · deployment-event
# Actor: deployment controller for software engineering
# Trigger: deployment-event request enters the software engineering queue
# Authority: tools only: nika:emit; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: one typed machine event carries the case identity and accepted state for uc-060-engineering-deployment-event
# Business outcome: publish a typed completion receipt for subscribers for software engineering

nika: uc-060-engineering-deployment-event

model: mock/echo

const:
  receipt: {"case":"uc-060-engineering-deployment-event","domain":"engineering","state":"accepted"}
permits:
  tools: ["nika:emit"]
tasks:
  publish:
    invoke:
      tool: "nika:emit"
      args:
        event_type: "gauntlet.engineering.deployment-event"
        payload: ${{ const.receipt }}
outputs:
  receipt: ${{ const.receipt }}
