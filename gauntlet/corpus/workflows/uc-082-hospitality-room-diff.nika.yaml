# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# Corpus case 82/100 · hospitality · room-diff
# Actor: rooms controller for hospitality
# Trigger: room-diff request enters the hospitality queue
# Authority: tools only: nika:validate; no filesystem, network, subprocess, secret, or ambient clock authority
# Failure oracle: validation report is valid with zero errors for uc-082-hospitality-room-diff
# Business outcome: refuse malformed business input before downstream work for hospitality

nika: uc-082-hospitality-room-diff

model: mock/echo

const:
  record: {"key":"uc-082-hospitality-room-diff","amount":182,"status":"ready"}
permits:
  tools: ["nika:validate"]
tasks:
  validate:
    invoke:
      tool: "nika:validate"
      args:
        data: ${{ const.record }}
        schema:
          type: object
          additionalProperties: false
          required: [key, amount, status]
          properties:
            key: { type: string }
            amount: { type: integer, minimum: 1 }
            status: { type: string, enum: [ready] }
outputs:
  report: ${{ tasks.validate.output }}
  record: ${{ const.record }}
